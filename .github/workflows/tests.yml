name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APIFY_TOKEN: ""
      GEMINI_API_KEY: ""
      USE_MODEL: "0"
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py config.py background_jobs.py request_limits.py web_security.py core db eval scripts
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -q
