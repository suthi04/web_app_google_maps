services:
  - type: web
    name: insightreview
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: insightreview-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/insightreview.db
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: USE_MODEL
        value: "0"
      - key: WEB_THREADS
        value: "4"
      - key: ANALYZE_MAX_CONCURRENT
        value: "1"
      - key: ANALYZE_MAX_QUEUED
        value: "10"
      - key: APIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
